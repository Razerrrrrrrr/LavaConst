name: Build
on:
  push:
    branches: [ '**' ]
    paths-ignore:
      - '**.md'
      - 'docker/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: lavaconst-plugin
          path: plugin/build/libs/lavaconst-plugin-*.jar
